name: CEREBRON F115 RDX Hybrid Retrieval DEV
on:
  push:
    branches: [main]
    paths:
      - 'config/rdx-hybrid-retrieval-dev-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet --no-cache-dir sentence-transformers huggingface_hub numpy
      - name: Select hybrid retrieval policy on DEV only
        run: python worker/rdx_hybrid_retrieval_dev.py
      - uses: actions/upload-artifact@v4
        with:
          name: f115-rdx-hybrid-retrieval-dev
          path: artifacts/rdx_hybrid_retrieval_dev.json
          if-no-files-found: error
      - name: Persist DEV receipt
        run: |
          mkdir -p receipts
          cp artifacts/rdx_hybrid_retrieval_dev.json receipts/rdx-hybrid-retrieval-dev-${{ github.run_id }}.json
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx-hybrid-retrieval-dev-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: F115 RDX hybrid retrieval DEV ${{ github.run_id }}"
          git pull --rebase origin main
          git push
