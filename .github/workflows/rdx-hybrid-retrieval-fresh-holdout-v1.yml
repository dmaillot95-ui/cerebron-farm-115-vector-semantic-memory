name: CEREBRON F115 RDX Hybrid Retrieval Fresh Holdout V1
on:
  push:
    branches: [main]
    paths:
      - 'config/rdx-hybrid-retrieval-fresh-holdout-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install vector runtime
        run: python -m pip install --quiet --no-cache-dir sentence-transformers huggingface_hub numpy
      - name: Run frozen hybrid policy on fresh holdout
        run: |
          cd worker
          python rdx_hybrid_retrieval_fresh_holdout_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: f115-rdx-hybrid-retrieval-fresh-holdout-v1
          path: worker/artifacts/rdx_hybrid_retrieval_fresh_holdout_v1.json
          if-no-files-found: error
      - name: Persist receipt
        run: |
          mkdir -p receipts
          cp worker/artifacts/rdx_hybrid_retrieval_fresh_holdout_v1.json receipts/rdx-hybrid-retrieval-fresh-holdout-v1-${{ github.run_id }}.json
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx-hybrid-retrieval-fresh-holdout-v1-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: F115 hybrid retrieval fresh holdout ${{ github.run_id }}"
          git pull --rebase origin main
          git push
